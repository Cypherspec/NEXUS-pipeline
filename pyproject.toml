[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-pipeline"
version = "1.0.0"
description = "Cross-fitted greedy ensemble selection with temperature calibration for tabular classification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
    "joblib>=1.3",
]

[project.optional-dependencies]
benchmark = ["matplotlib>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["nexus*", "tabular_ensemble*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tabular_ensemble/tests"]
